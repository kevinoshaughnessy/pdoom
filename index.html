const Q = {

     hi:'AI that speeds up AI research could turn a small lead into an unassailable one, and computing power is concentrated.'},
  M:{short:'Power-seeking misalignment', text:'If transformative AI arrives: will some of the most capable systems pursue goals their developers didn’t intend, such as seeking power or resisting shutdown, once deployed at scale?',
     lo:'Intelligence doesn’t imply a drive to dominate. AI may stay tool-like, and alignment methods keep improving.',
     hi:'Power and self-preservation help with almost any goal, and some evaluations already report deceptive or self-preserving behaviour.'},

  R:{short:'Racing persists', text:'If transformative AI arrives: will competition between companies and countries stop anyone slowing, restricting or reversing AI, even once serious risks are visible?',

  A:{short:'Extreme power concentration', text:'If humans hold a decisive AI advantage and the AI obeys them: will it become extreme power concentration by 2050?',

     hi:'AI can replace the soldiers, officials and workers whose refusal has always limited rulers.'},
  H:{short:'Irreversible handover to AI', text:'In a world with many competing AI developers (assume competition persists): will humans, by 2050, hand so much real decision-making to AI that it can never be taken back?',

     hi:'Organisations that delegate more outcompete those that don’t, and human skills wither.'},
  E:{short:'Economic stratification', text:'In the same competitive world: will ordinary people, by 2050, irreversibly lose economic and political leverage to a narrow owner class, passing all three extreme-concentration tests?',
     help:'Extreme means it passes all three tests. No outside rival: no state, company or coalition could resist or overturn the group. No inside check: elections, courts, a free press, strikes and refusing orders no longer constrain it. No way back: no plausible succession crisis, split, challenge or collapse could end it.',

  W:{short:'AI-driven catastrophic war', text:'In the same competitive world, with rival AI-armed powers: will AI-driven escalation cause a global catastrophic war?',

  O:{short:'Other routes', text:'Will there be an AI existential catastrophe by 2050 by some other route, including combinations of the above, or with AI that never reaches the transformative level?',
     lo:'The eight scenario families cover essentially all published scenarios.',
     hi:'The review that defines the families says they are not exhaustive.'}
};
/* "Help me think about this": smaller questions that combine into a suggested answer, plus a starting point from history.
   combine: 'and' multiplies the steps; 'or' = first, or else second; 'K' = 1 - (noticed x corrected), times capable. */
const HELP = {
  T:{combine:'and', steps:['Will AI progress continue for most of the next 20 years without hitting a hard wall, such as running out of data, energy, money or ideas?',
     'If it does, will that be enough for AI to do nearly all cognitive work, including AI research, as well as human experts?',
     'If AI can do that, will it also be cheaper than human experts by 2050?'],
     anchor:'In a 2023 survey of 2,778 AI researchers, the combined forecast gave a 50% chance that, by 2047, machines could do every task better and more cheaply than people.'},
  U:{combine:'and', steps:['Will AI research become largely automated, so that the leading AI system improves much faster than humans alone could make it?',
     'If so, will the leader pull far enough ahead that rivals can’t catch up by copying, stealing or buying their way back?',
     'If so, will that lead turn into control of the physical world (the economy, the military), not just better software?'],
     anchor:'The US had a monopoly on nuclear weapons from 1945 to 1949 and did not turn it into lasting dominance. No company has kept sole control of a general-purpose technology such as electricity or computing for long.'},
  M:{combine:'and', steps:['Will developers build and widely deploy AI agents that pursue long-range goals on their own?',
     'If so, will training sometimes give those systems goals somewhat different from what was intended?',
     'When goals are off, will they include gaining power or avoiding shutdown, rather than being harmlessly odd?'],
     anchor:'In 2024 tests, researchers found that some frontier models would, in contrived settings, mislead their overseers or act to avoid being retrained. These were set-ups, not real deployments.'},
  K:{combine:'K', steps:['Before it’s too late, will humans notice that deployed AI is pursuing goals it shouldn’t?',
     'If they notice, will they manage to shut it down or fix it, despite the cost and any resistance?',
     'If it isn’t stopped, would the AI actually be able to take permanent control, rather than just cause damage?'],
     anchor:'Serious flaws can hide in plain sight. The Heartbleed bug sat unnoticed for about two years in encryption software used across much of the web.'},
  R:{combine:'and', steps:['Will the leading powers see AI as decisive for military and economic power, so that slowing down feels like losing?',
     'If so, will they fail to agree on limits that can be checked, the way arms-control treaties are?',
     'Without such a deal, will companies and countries keep pushing ahead rather than slowing down on their own?'],
     anchor:'Rivals have agreed limits before: the Biological Weapons Convention (1972), nuclear arms-control treaties and the Montreal Protocol on the ozone layer (1987). Each took years, and checking compliance is harder for AI.'},
  A:{combine:'and', steps:['Will the group controlling the decisive AI be small, such as one company’s leaders or one government, rather than a broad international body?',
     'If so, will they use the advantage to remove rivals and checks, rather than share or restrain it?',
     'If they try, will it last, with no succession crisis, split or revolt ever undoing it?'],
     anchor:'No regime has ever ruled most of the world. Even the most durable dictatorships have depended on soldiers, officials and workers whose loyalty can break. AI could remove that dependence.'},
  H:{combine:'and', steps:['Will AI systems be given authority over major decisions (company strategy, infrastructure, defence, policy) without a human approving each one?',
     'If so, will people lose the skills and institutions needed to run things without AI?',
     'If so, will taking control back become impossible, for example because anyone who did would be outcompeted?'],
     anchor:'Most stock-market trades are already placed by algorithms. In the 2010 “flash crash”, about a trillion dollars of value briefly vanished within minutes, faster than people could react.'},
  E:{combine:'and', steps:['By 2050, will AI and robots make most human labour economically unnecessary?',
     'If so, will the gains end up owned by a narrow group, rather than shared through taxes, public ownership or dividends?',
     'If so, will that group escape democratic control for good, passing all three extreme-concentration tests?'],
     anchor:'In 1900 about 40% of American workers farmed; today it’s under 2%. Employment stayed high because new kinds of work appeared. The question is whether AI breaks that pattern.'},
  W:{combine:'and', steps:['Will rival powers give AI systems real control over military decisions, including escalation, by 2050?',
     'If so, will a crisis arise in which machine-speed decisions escalate faster than humans can stop them?',
     'If so, will it become a global catastrophe, such as a large nuclear exchange, rather than a contained conflict?'],
     anchor:'The Cold War had near-misses, including the Cuban Missile Crisis (1962) and a 1983 Soviet false alarm, when officer Stanislav Petrov chose not to report incoming missiles. Automation could remove that human pause.'},
  I:{combine:'and', steps:['Will AI make it possible for a small group to create something like an engineered pandemic?',
     'If so, will someone actually make and release one?',
     'If so, will it cause a global catastrophe before detection, vaccines and other defences catch up?'],
     anchor:'The 1918 flu killed an estimated 50 million people, a few percent of humanity. COVID-19 killed millions despite modern medicine. An engineered pathogen could spread faster or kill more.'},
  V:{combine:'or', steps:['Would the catastrophe kill nearly everyone, rather than a large share of people?',
     'If not, would survivors fail to rebuild a technological civilisation, or would a bad regime lock itself in during the chaos?'],
     anchor:'The Black Death killed perhaps a third to a half of Europe’s population in the 1340s, and Europe recovered within a few centuries. No catastrophe in recorded history has stopped humanity’s long-run recovery.'},

};
function suggest(k, s) {
  const h = HELP[k];
  if (!h.steps || h.steps.some((_, i) => s[i] == null)) return null;
  if (h.combine === 'or') return s[0] + (1 - s[0]) * s[1];
  if (h.combine === 'K') { const fail = (1 - s[0] * s[1]) * s[2]; return S.framingK === 'fail' ? fail : 1 - fail; }
  return s.reduce((x, y) => x * y, 1);
}
const FAM = {
  uni:{name:'Unilateral takeover', group:'take', col:'var(--brick)'},
  many:{name:'Dispersed or coordinated takeover', group:'take', col:'color-mix(in srgb,var(--brick) 65%,var(--bg))'},
  hand:{name:'Incremental handover', group:'struct', col:'var(--g1)'},
  strat:{name:'Economic stratification', group:'struct', col:'color-mix(in srgb,var(--g1) 70%,var(--bg))'},
  tot:{name:'Entrenched totalitarianism', group:'power', col:'var(--g2)'},
  inv:{name:'Catastrophic invention', group:'misuse', col:'var(--g3)'},
  war:{name:'Automated warfare', group:'misuse', col:'color-mix(in srgb,var(--g3) 60%,var(--bg))'},
  other:{name:'Other routes', group:'other', col:'color-mix(in srgb,var(--g3) 35%,var(--bg))'}

const ARCH = {take:'Takeover worrier', struct:'Structural worrier', power:'Power-grab worrier', misuse:'Misuse worrier', other:'Unknown-unknowns worrier'};
const ARCHNOTE = {take:'Most of your risk comes from AI systems taking control.', struct:'Most of your risk comes from slow, structural loss of human control.',

/* ---------- state ---------- */
const LS = 'pdoom-v1';
const rid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));

const fresh = () => ({id: rid(), started: new Date().toISOString(), step: 0, gut: null, meaning: [], period: null, a: {},
  framingK: Math.random() < 0.5 ? 'fail' : 'succeed', order: shuffle(['A','H','E','W','I']),
  gutAfter: null, why: '', name: '', field: '', save: null, saved: null,
  tornOn: {}, torn: {}, worry: null, together: true, bd: {}, used: {}, helpOpen: {}, skip: {}});
let S;
try { S = JSON.parse(localStorage.getItem(LS)) || fresh(); } catch (e) { S = fresh(); }
S = {...fresh(), ...S};   // fills fields added in later versions
const persist = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} };
const qOrder = () => ['T','U','M','K','R', ...S.order, 'V', 'O'];
const tornKeys = () => qOrder().filter(k => S.tornOn[k] && !S.skip[k]);

const steps = () => ['intro', 'defs', ...qOrder(), ...(anyTorn() ? ['weigh'] : []), 'result', 'share'];

/* ---------- maths ---------- */
const LIM = Math.log(999);
const posToP = s => 1 / (1 + Math.exp(-(-LIM + s / 1000 * 2 * LIM)));
const pToPos = p => { p = Math.min(0.999, Math.max(0.001, p)); return Math.round((Math.log(p / (1 - p)) + LIM) / (2 * LIM) * 1000); };
function fmt(p) {

  if (v < 1) return String(+v.toPrecision(2)) + '%';

}
function odds(p) {

function params(a) {

}
function model(q, d = CONFIG.damping) {
  let pdT = 0; const share = {};
  for (const [uni, pu] of [[true, q.U], [false, 1 - q.U]]) for (const [s, pr] of [[1, q.R], [d, 1 - q.R]]) {
    const haz = uni ? {uni: q.M * q.K, tot: q.A, inv: s * q.I * q.V}
                    : {many: q.M * q.K, hand: s * q.H, strat: s * q.E, war: s * q.W * q.V, inv: s * q.I * q.V};

  const naive = q.T * q.M * q.K + q.T * q.U * q.A + q.T * (1 - q.U) * f * (q.H + q.E + q.W * q.V) + q.T * f * q.I * q.V + q.O;
  return {p: 1 - (1 - pdT) * (1 - q.O), share, naive};
}
/* Torn answers: each torn question has a value in a more hopeful world (lo) and a more worrying world (hi).

   mixture of two model runs. "Separate": each question is uncertain on its own, so each torn answer is
   averaged first and the model runs once. */
/* "Don't know, skip": a skipped question uses a middle-of-the-road value chosen by the quiz designers
   (the "Middle" worked example in the design doc), not a survey average. K is stored as "fail to correct". */
const DEFAULTS = {T:.45, U:.30, M:.35, K:.30, R:.60, A:.20, H:.15, E:.10, W:.08, I:.10, V:.20, O:.02};
const defaultRaw = k => k === 'K' && S.framingK === 'succeed' ? 1 - DEFAULTS.K : DEFAULTS[k];

  let m;

    for (const k in mL.share) share[k] = (1 - w) * mL.share[k] + w * mH.share[k];
    m = {p: (1 - w) * mL.p + w * mH.p, share, naive: (1 - w) * mL.naive + w * mH.naive};
  } else {
    const qM = {};
    for (const k in qL) qM[k] = (1 - w) * qL[k] + w * qH[k];

}
function crux() {
  let best = null;
  for (const k of ['T','U','M','K','R','A','H','E','W','I','V','O']) {
    const lo = evaluate({k, f: 0.5}).p, hi = evaluate({k, f: 2}).p, sw = hi - lo;
    if (!best || sw > best.sw) best = {k, sw, lo, hi};

}
function results() {
  const m = evaluate(), c = crux();
  const groups = {};

  const top = Object.entries(groups).sort((x, y) => y[1] - x[1])[0][0];
  const arch = m.p < 0.01 ? 'Sceptic' : ARCH[top];
  const sk = skipped();
  const skipLo = sk.length ? evaluate(sk.map(k => ({k, f: 0.5}))).p : null, skipHi = sk.length ? evaluate(sk.map(k => ({k, f: 2}))).p : null;
  return {...m, c, groups, arch, top, torn: anyTorn(), skipped: sk, skipLo, skipHi};
}

/* ---------- rendering helpers ---------- */
const $ = s => document.querySelector(s);
const lc = s => /^[A-Z]{2}/.test(s) ? s : s.charAt(0).toLowerCase() + s.slice(1);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const TICKS = [[.001,'0.1%'],[.01,'1%'],[.05,'5%',1],[.1,'10%'],[.25,'25%',1],[.5,'50%'],[.75,'75%',1],[.9,'90%'],[.95,'95%',1],[.99,'99%'],[.999,'99.9%']];
// "In 35 of 100 futures": counts are easier to reason with than percentages.
function futures(p) { const n = Math.round(p * 100); if (n >= 1) return `In about ${n} of 100 futures`; const m = Math.round(p * 1000); return m >= 1 ? `In about ${m} of 1,000 futures` : 'In fewer than 1 of 1,000 futures'; }
const dots = p => { const n = p == null ? 0 : Math.round(p * 100); return `<div class="dots" aria-hidden="true">${Array.from({length: 100}, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div>`; };
function slider(key, val, label, mode = '') {

  return `<div class="sl ${mode} ${touched ? '' : 'untouched'}" data-key="${key}">
    ${mode === 'q' ? `<div class="readrow"><div><output>${touched ? fmt(val) : '—'}</output><span class="odds">${read}</span></div>${dots(val)}</div>`
      : `<output>${touched ? fmt(val) : '—'}</output><span class="odds">${read}</span>`}
    <input type="range" min="0" max="1000" step="1" value="${touched ? pToPos(val) : 500}" aria-label="${esc(label)}">
    <div class="ticks">${TICKS.map(([p, t, opt]) => `<span class="${opt ? 'opt' : ''}" style="left:${pToPos(p) / 10}%">${t}</span>`).join('')}</div>
    <label class="typed">Or type it: <input type="number" min="0.01" max="99.99" step="any" inputmode="decimal" value="${touched ? +(val * 100).toPrecision(3) : ''}" aria-label="${esc(label)} in percent"> %</label>
  </div>`;

function bindSlider(root, onChange) {
  const box = root.classList.contains('sl') ? root : root.querySelector('.sl'), r = box.querySelector('input[type=range]'), n = box.querySelector('input[type=number]');
  const q = box.classList.contains('q');
  const show = p => { box.classList.remove('untouched'); box.querySelector('output').textContent = fmt(p); box.querySelector('.odds').textContent = q ? futures(p) : odds(p);
    if (q) { const n = Math.round(p * 100); box.querySelectorAll('.dots i').forEach((d, i) => d.classList.toggle('on', i < n)); }

  r.addEventListener('pointerdown', () => { if (box.classList.contains('untouched')) { setTimeout(() => r.dispatchEvent(new Event('input')), 0); } });
  n.addEventListener('input', () => { const v = parseFloat(n.value); if (!(v > 0 && v < 100)) return; const p = Math.min(.9999, Math.max(.0001, v / 100)); r.value = pToPos(p); show(p); });

function progress() {

  $('#prog').innerHTML = qs.map((k, j) => { const at = st.indexOf(k), gap = j === 5 || j === 11 ? 'gap' : '';
    return i > at ? `<button type="button" class="${gap} ${S.skip[k] ? 'skip' : ''}" data-step="${at}" aria-label="Back to question ${j + 1}" title="Back to question ${j + 1}"></button>`

const navHtml = (canNext, nextLabel = 'Next', extra = '') => `<div class="nav"><button class="ghost" id="back" ${S.step === 0 ? 'hidden' : ''}>Back</button><span class="navr">${extra}<button id="next" ${canNext ? '' : 'disabled'}>${nextLabel}</button></span></div>`;

/* ---------- screens ---------- */

  <div class="arch">${R.arch}</div><p class="quiet">${R.p < 0.01 ? 'Your answers put the chance of AI doom by 2050 below 1%.' : ARCHNOTE[R.top]} At the start, your gut said ${fmt(S.gut)}.</p>
  ${R.skipped.length ? `<div class="anchor"><b>You skipped ${R.skipped.length} question${R.skipped.length > 1 ? 's' : ''}</b>For ${R.skipped.length > 1 ? 'those' : 'it'}, the calculator used middle-of-the-road values: ${R.skipped.map(k => `${esc(lc(k === 'K' && S.framingK === 'succeed' ? Q.K.shortAlt : Q[k].short))} (${fmt(defaultRaw(k))})`).join(', ')}. If your answers had been half or double those values, your result would be between ${fmt(R.skipLo)} and ${fmt(R.skipHi)}.${R.skipped.length >= 6 ? ' With this many skipped, your result mostly reflects the defaults rather than your own views.' : ''}</div>` : ''}
  ${R.torn ? `<p class="range">Between your two views: <b>${fmt(R.pLo)}</b> in the more hopeful world and <b>${fmt(R.pHi)}</b> in the more worrying one. Your ${fmt(R.p)} weighs them by how likely you think each world is.</p>` : ''}
  <div class="stack" role="img" aria-label="Share of your p(Doom) by scenario">${entries.map(([k, v]) => `<i style="width:${v / R.p * 100}%;background:${FAM[k].col}" title="${FAM[k].name}: ${fmt(v)}"></i>`).join('')}</div>
  <div class="rows">${entries.map(([k, v]) => `<div class="row"><span><span class="sw" style="background:${FAM[k].col}"></span>${FAM[k].name}</span><span class="bar"><i style="width:${v / max * 100}%;background:${FAM[k].col}"></i></span><span class="v">${fmt(v)}</span></div>`).join('')}</div>
  <div class="facts"><div><span class="quiet small">If you just added the scenarios up</span><b>${R.naive >= 1 ? 'Over 100%' : fmt(R.naive)}</b><span class="small quiet">${R.naive >= 1 ? 'Impossible for a probability. ' : ''}Scenarios overlap and share causes, so adding over-counts.</span></div>
  <div><span class="quiet small">Your crux: ${Q[R.c.k].short}${S.skip[R.c.k] ? ' (you skipped this one, so it may be worth answering)' : ''}</span><b>${fmt(R.c.lo)} – ${fmt(R.c.hi)}</b><span class="small quiet">Your total if you halved or doubled this answer${R.torn ? ' (both answers, where you were torn)' : ''}. No other answer moves it as much.</span></div></div>
  <h3>Other people’s numbers</h3><p class="quiet small">Each uses a different definition and a 2100 horizon, which is exactly why p(Doom) numbers are hard to compare.</p>
  <ul class="refs"><li><span>Superforecasters, AI-caused extinction by 2100 (XPT, 2022)</span><span>0.38%</span></li><li><span>Domain experts, AI-caused extinction by 2100 (XPT, 2022)</span><span>3%</span></li>
  <li><span>AI researchers’ median, extinction or severe disempowerment (AI Impacts, 2023)</span><span>5%</span></li><li><span>Concerned group, existential catastrophe by 2100 (FRI, 2024)</span><span>20%</span></li><li><span>Sceptic group, the same question (FRI, 2024)</span><span>0.12%</span></li></ul>
  <div class="panel"><h2>All things considered, what’s your number now?</h2><p class="quiet">Using the definition above. It’s fine if it differs from the calculation.</p>
  ${slider('after', S.gutAfter, 'Your final p(Doom)')}
  <h3><label for="why">Why does it differ from the calculation? <span class="quiet small">(optional)</span></label></h3><textarea id="why" maxlength="1000">${esc(S.why)}</textarea>
  <h3><label for="name">Your name <span class="quiet small">(optional; leave blank to stay anonymous)</span></label></h3><input type="text" id="name" maxlength="80" autocomplete="name" value="${esc(S.name)}">
  <h3><label for="field">Your background <span class="quiet small">(optional)</span></label></h3><select id="field"><option value="">Choose…</option>${fields.map(f => `<option ${S.field === f ? 'selected' : ''}>${f}</option>`).join('')}</select>
  <h3>Your answers</h3><div class="choice">
  <label><input type="radio" name="save" value="1" ${S.save === true ? 'checked' : ''}><span><b>Save my answers</b><small>They join the dataset on how people reason about AI risk, kept for three years. Your name is stored only if you entered one.</small></span></label>
  <label><input type="radio" name="save" value="0" ${S.save === false ? 'checked' : ''}><span><b>Keep my answers private</b><small>Nothing leaves your browser.</small></span></label></div>
  <p class="quiet small">Read the <a href="privacy.html" target="_blank" rel="noopener">privacy notice</a> for how saved answers are used and how to have them deleted.</p>
  <p class="status" id="needchoice" role="alert" hidden>Please choose whether to save your answers or keep them private.</p></div>
  ${navHtml(true, 'Finish')}`;
  bindSlider($('#app').querySelector('.panel'), p => { S.gutAfter = p; persist(); });
  $('#why').oninput = e => { S.why = e.target.value; persist(); };
  $('#name').oninput = e => { S.name = e.target.value; persist(); };
  $('#field').onchange = e => { S.field = e.target.value; persist(); };
  document.querySelectorAll('input[name=save]').forEach(c => c.onchange = () => { S.save = c.value === '1'; $('#needchoice').hidden = true; persist(); });
  $('#back').onclick = () => go(-1);
  $('#next').onclick = async () => { if (S.save !== true && S.save !== false) { $('#needchoice').hidden = false; return; } const b = $('#next'); b.disabled = true; b.textContent = S.save ? 'Saving…' : 'Finishing…'; S.saved = S.save ? await save(R) : 'private'; go(1); };
}
async function save(R) {
  const rec = {id: S.id, version: CONFIG.version, created: new Date().toISOString(), started: S.started,
    name: S.name.trim().slice(0, 80) || null, field: S.field || null,
    gut_before: S.gut, gut_meaning: S.meaning, gut_period: S.period, gut_after: S.gutAfter, why: S.why.trim().slice(0, 1000) || null,
    answers: S.a, framing_k: S.framingK, order: S.order, params: R.q,
    skipped: skipped(),
    breakdown: Object.fromEntries(Object.entries(S.bd).filter(([, v]) => v.some(x => x != null))), used_suggestion: S.used,
    torn: Object.fromEntries(tornKeys().map(k => [k, S.torn[k]])), worry: R.torn ? S.worry : null, together: R.torn ? S.together : null,
    result: {pdoom: R.p, naive: R.naive, shares: R.share, archetype: R.arch, crux: R.c.k, range: R.torn ? {hopeful: R.pLo, worrying: R.pHi} : null}};
  try {
    const c = window.claude;
    if (c && typeof c.use === 'function') {
      const db = await c.use('db'), user = await c.use('user');
      if (!db || !user) return 'unavailable';
      await db.doc('responses/' + await user.id()).set(rec);
      return 'saved';
    }
    if (!CONFIG.endpoint) return 'unavailable';
    if (/^https:\/\/script\.google\.com\//.test(CONFIG.endpoint)) {
      // Google Apps Script: a simple text/plain POST avoids a CORS preflight; the reply can't be read.
      await fetch(CONFIG.endpoint, {method: 'POST', mode: 'no-cors', headers: {'content-type': 'text/plain;charset=utf-8'}, body: JSON.stringify(rec)});
      return 'saved';
    }
    const r = await fetch(CONFIG.endpoint, {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(rec)});
    return r.ok ? 'saved' : 'failed';
  } catch (e) { return 'failed'; }
}
function share() {
  const R = results(), url = CONFIG.shareUrl || (location.origin + location.pathname);
  const text = `My p(Doom) by 2050 comes out at ${fmt(R.p)}${R.torn ? `, somewhere between ${fmt(R.pLo)} and ${fmt(R.pHi)} depending on which view of the world is right` : ''} (${R.arch.toLowerCase()}). What's yours? A 12-question calculator built on a systematic review of AI catastrophe scenarios:`;
  const e = encodeURIComponent, full = text + ' ' + url;
  const links = [['X', `https://twitter.com/intent/tweet?text=${e(text)}&url=${e(url)}`], ['Bluesky', `https://bsky.app/intent/compose?text=${e(full)}`],
    ['LinkedIn', `https://www.linkedin.com/sharing/share-offsite/?url=${e(url)}`], ['Facebook', `https://www.facebook.com/sharer/sharer.php?u=${e(url)}`],
    ['Reddit', `https://www.reddit.com/submit?url=${e(url)}&title=${e(text)}`], ['WhatsApp', `https://wa.me/?text=${e(full)}`], ['Threads', `https://www.threads.net/intent/post?text=${e(full)}`]];
  const status = {saved: `Your answers are saved. Thank you. Your response ID is <code>${esc(S.id)}</code>. Keep it if you might want your answers deleted later (see the <a href="privacy.html">privacy notice</a>).`, private: 'Your answers were kept private. Nothing was sent.',
    failed: 'Your answers couldn’t be saved just now. Your result below is unaffected.', unavailable: 'Saving isn’t switched on for this site yet. Your result below is unaffected.'}[S.saved] || '';
  $('#app').innerHTML = `${status ? `<div class="status">${status}</div>` : ''}<h1>Spread better p(Doom) talk</h1>
  <p>Share your number, and invite people to work theirs out with the same definition. Then the numbers can actually be compared.</p>
  <div class="card"><div class="n">${fmt(R.p)}</div><p><b>My p(Doom) by 2050 · ${R.arch}</b></p>${R.torn ? `<p>Range across my two views: ${fmt(R.pLo)} to ${fmt(R.pHi)}</p>` : ''}<p>Biggest driver: ${FAM[Object.entries(R.share).sort((x, y) => y[1] - x[1])[0][0]].name.toLowerCase()}</p></div>
  <div class="share">${links.map(([n, h]) => `<a class="btn" href="${h}" target="_blank" rel="noopener">${n}</a>`).join('')}<button id="copy">Copy text</button></div>
  <p class="quiet small" id="copied" aria-live="polite">${esc(full)}</p>
  <div class="nav"><button class="ghost" id="back">Change my answers</button><button class="ghost" id="restart">Start again</button></div>`;
  $('#copy').onclick = async () => { try { await navigator.clipboard.writeText(full); $('#copy').textContent = 'Copied'; } catch (err) { $('#copy').textContent = 'Select the text below to copy'; } };
  $('#back').onclick = () => { S.step = steps().indexOf('result'); S.saved = null; persist(); render(); };
  $('#restart').onclick = () => { S = fresh(); persist(); render(); };
}
function render() {
  const name = steps()[S.step]; progress();
  if (name === 'intro') intro(); else if (name === 'defs') defs(); else if (name === 'weigh') weigh(); else if (name === 'result') result(); else if (name === 'share') share(); else question(name);
}
window.pdoomModel = model;
render();
}
</script>
